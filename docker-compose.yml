services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tributax
      POSTGRES_PASSWORD: tributax
      POSTGRES_DB: tributax
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tributax"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://tributax:tributax@postgres:5432/tributax
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
