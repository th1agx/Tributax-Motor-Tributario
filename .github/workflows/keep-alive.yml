name: keep-alive

# Render free tier adormece o serviço após ~15 min sem tráfego e a primeira
# visita seguinte enfrenta a tela de cold start. Este ping a cada 14 min
# mantém a instância desperta (750 h/mês grátis >= 744 h de um serviço 24/7).

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping docs (mantém instância acordada)
        run: curl -sS -o /dev/null -w "%{http_code} %{time_total}s\n" https://tributax-api.onrender.com/docs
