name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (typecheck estrito)
        run: npm run build

      - name: Test
        run: npm test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tributax
          POSTGRES_PASSWORD: tributax
          POSTGRES_DB: tributax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tributax"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tributax:tributax@localhost:5432/tributax
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply migrations
        working-directory: packages/infrastructure
        run: npx drizzle-kit migrate

      - name: Apply custom constraints (vigência disjunta)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -f packages/infrastructure/drizzle/custom/01_no_overlap.sql

      - name: Seed rule catalog
        working-directory: packages/infrastructure
        run: npx tsx src/seed.ts

      - name: Integration tests
        run: npm run test --workspace=@tributax/infrastructure
