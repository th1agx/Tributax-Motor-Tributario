name: LegislationWatch

# ADR-012/013: varredura semanal assistida por IA. Sem OPENAI_API_KEY roda
# em modo offline (coleta determinística; extração sai vazia — pipeline
# validado, custo zero). Com a secret, extrai observações e produz report.
# Com TRIBUTAX_API_URL + TRIBUTAX_API_KEY, aplica as propostas DRAFT via API.

on:
  schedule:
    - cron: "0 6 * * 1" # segundas, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: legislation-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # API gratuita do Querido Diário limita requisições paralelas (503/520
      # observados com 6 jobs simultâneos) — 2 por vez + retry/backoff
      max-parallel: 2
      matrix:
        include:
          # ISS municipal é o alvo principal: alíquota é lei municipal e o
          # Querido Diário cobre diários municipais. Foco nos municípios do
          # catálogo (territory_id IBGE 7 dígitos) + varredura nacional.
          - { tribute: ISS, territory_id: "3550308", label: sao-paulo }
          - { tribute: ISS, territory_id: "3304557", label: rio-de-janeiro }
          - { tribute: ISS, territory_id: "3106200", label: belo-horizonte }
          - { tribute: ISS, label: nacional }
          # federais: Querido Diário não cobre DOU; coleta depende de RSS
          # (WATCH_RSS_FEEDS) até fonte federal documentada — matrix mantida
          # para quando a fonte entrar
          - { tribute: ICMS, uf: RJ }
          - { tribute: ICMS, uf: SP }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Run watch cycle (dry-run)
        working-directory: packages/collector
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WATCH_RSS_FEEDS: ${{ secrets.WATCH_RSS_FEEDS }}
          WATCH_QD_TERRITORY_ID: ${{ matrix.territory_id }}
        run: |
          npx tsx src/agent/rag-watch.cli.ts \
            --tribute ${{ matrix.tribute }} ${{ matrix.uf && format('--uf {0}', matrix.uf) || '' }} \
            --since 8 --out "watch-report-${{ matrix.tribute }}${{ matrix.label && format('-{0}', matrix.label) || (matrix.uf && format('-{0}', matrix.uf)) || '' }}.json"

      - name: Apply to API (optional — creates DRAFTs only)
        working-directory: packages/collector
        env:
          # /v1/rules é admin-only (auditoria 3.3/3.7): sem a key o agente
          # recebia 401 silencioso nas duas pontas
          TRIBUTAX_API_URL: ${{ secrets.TRIBUTAX_API_URL }}
          TRIBUTAX_ADMIN_KEY: ${{ secrets.TRIBUTAX_ADMIN_KEY }}
        run: |
          if [ -z "$TRIBUTAX_API_URL" ] || [ -z "$TRIBUTAX_ADMIN_KEY" ]; then
            echo "TRIBUTAX_API_URL/TRIBUTAX_ADMIN_KEY ausentes — pulando apply (somente report)"
            exit 0
          fi
          npx tsx ../api/src/monitoring/watch-agent.cli.ts \
            --api "$TRIBUTAX_API_URL" \
            --report "watch-report-${{ matrix.tribute }}${{ matrix.label && format('-{0}', matrix.label) || (matrix.uf && format('-{0}', matrix.uf)) || '' }}.json" \
            --apply

      - uses: actions/upload-artifact@v4
        with:
          name: watch-report-${{ matrix.tribute }}${{ matrix.label && format('-{0}', matrix.label) || (matrix.uf && format('-{0}', matrix.uf)) || '' }}
          path: packages/collector/watch-report-*.json
          retention-days: 30
